<div class="row">
    <div class="col-md-12">
        <div class="x_panel">
            <div class="x_title">
                <h2><i class="fa fa-truck"></i> Suppliers Directory</h2>
                <ul class="nav navbar-right panel_toolbox">
                    <li><a ui-sref="addSupplier" class="btn btn-primary btn-xs"><i class="fa fa-plus"></i> Add New Supplier</a></li>
                </ul>
                <div class="clearfix"></div>
            </div>
            <div class="x_content">
                <div class="row" style="margin-bottom: 15px;">
                    <div class="col-md-4">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Search supplier name, phone, city..." ng-model="search" ng-change="loadSuppliers()">
                            <span class="input-group-btn">
                                <button class="btn btn-default" type="button" ng-click="loadSuppliers()"><i class="fa fa-search"></i></button>
                            </span>
                        </div>
                    </div>
                </div>

                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Supplier Name</th>
                            <th>Contact Person</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>City / Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="sup in suppliers">
                            <td><strong>{{sup.name}}</strong></td>
                            <td>{{sup.contactPerson || '-'}}</td>
                            <td>{{sup.phone}}</td>
                            <td>{{sup.email || '-'}}</td>
                            <td>{{sup.address || ''}} {{sup.city ? '(' + sup.city + ')' : ''}}</td>
                            <td>
                                <a ui-sref="editSupplier({id: sup._id})" class="btn btn-xs btn-primary"><i class="fa fa-edit"></i> Edit</a>
                                <button class="btn btn-xs btn-danger" ng-click="deletesupplier(sup._id)"><i class="fa fa-trash"></i> Delete</button>
                            </td>
                        </tr>
                        <tr ng-if="suppliers.length === 0">
                            <td colspan="6" class="text-center text-muted">No suppliers found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
